# Render Blueprint for the PH5 backend (https://render.com/docs/blueprint-spec)
# NOTE: the three models need ~1.5-2 GB RAM; Render's free plan has 512 MB.
# See docs/DEPLOYMENT.md for options.
services:
  - type: web
    name: ph5-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PRELOAD_MODELS
        value: "false"
      - key: QUANTIZE_MODELS
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: HF_MODEL_REPO
        sync: false # e.g. your-hf-username/ph5-models
      - key: HF_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
